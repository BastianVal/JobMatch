spring:
  application:
    name: jobmatch
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobmatch}
    username: ${SPRING_DATASOURCE_USERNAME:jobmatch}
    password: ${SPRING_DATASOURCE_PASSWORD:jobmatch-local}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: iam.spring_session
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ${SESSION_COOKIE_NAME:__Host-jobmatch_session}
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
        path: /
jobmatch:
  security:
    token-secret: ${TOKEN_SECRET:local-development-secret-change-this-before-production}
    rate-limit-pepper: ${RATE_LIMIT_PEPPER:local-rate-limit-pepper}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8090}
  mail:
    from: ${MAIL_FROM:no-reply@jobmatch.local}
  worker:
    poll-delay-ms: 1000
    lease-seconds: 60
  cv:
    storage-root: ${CV_STORAGE_ROOT:/var/lib/jobmatch/cv}
    max-file-bytes: 5242880
    max-active-documents: 5
    parse-timeout-seconds: 60
    proposal-lifetime-days: 30
