name: jobmatch-local

x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  environment:
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobmatch}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobmatch}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch-local}
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [private]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobmatch}
      POSTGRES_USER: ${POSTGRES_USER:-jobmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]

  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["--spring.profiles.active=migrate"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobmatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobmatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    <<: *backend
    command: ["--spring.profiles.active=api"]
    volumes:
      - cv_files:/var/lib/jobmatch/cv
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobmatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobmatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch-local}
      SESSION_COOKIE_NAME: jobmatch_session
      SESSION_COOKIE_SECURE: "false"
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-secret-change-this-before-production}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-local-rate-limit-pepper}
      PUBLIC_BASE_URL: http://localhost:${HTTP_PORT:-8090}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend
    command: ["--spring.profiles.active=worker"]
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - cv_files:/var/lib/jobmatch/cv
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobmatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobmatch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch-local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-secret-change-this-before-production}
      PUBLIC_BASE_URL: http://localhost:${HTTP_PORT:-8090}
    depends_on:
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edge, private]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    ports:
      - "${HTTP_PORT:-8090}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [edge, private]

networks:
  edge: {}
  private:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  cv_files:
