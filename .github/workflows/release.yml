name: Release to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable tag to publish and deploy; leave empty to use the triggering commit SHA.
        required: false
        type: string
      rollback_image_tag:
        description: Existing immutable image tag to deploy without publishing. Leave empty for a normal release.
        required: false
        type: string
      deploy:
        description: Deploy the published images to the configured EC2 host.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${{ inputs.rollback_image_tag || inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: inputs.rollback_image_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jobmatch-backend:${{ needs.prepare.outputs.image_tag }}
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jobmatch-frontend:${{ needs.prepare.outputs.image_tag }}

  deploy:
    if: ${{ always() && inputs.deploy && (inputs.rollback_image_tag != '' || needs.publish.result == 'success') }}
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy immutable images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /srv/jobmatch
            export JOBMATCH_IMAGE_TAG='${{ needs.prepare.outputs.image_tag }}'
            docker compose --env-file .env -f compose.yaml -f compose.prod.yaml pull
            docker compose --env-file .env -f compose.yaml -f compose.prod.yaml up -d postgres frontend
            docker compose --env-file .env -f compose.yaml -f compose.prod.yaml up migrate
            docker compose --env-file .env -f compose.yaml -f compose.prod.yaml up -d api worker caddy
            docker compose --env-file .env -f compose.yaml -f compose.prod.yaml exec -T api wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'
